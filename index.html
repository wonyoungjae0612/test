<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8faf7">
  <meta name="description" content="AI 이미지 판별, verif.ai.">
  <title>AI 이미지 판별 · verif.ai</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-scan" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3M7 12l3 3 7-7"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 6-6 4 4 3-3 5 5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  </defs></svg>
  <header class="header">
    <a href="/" class="brand" aria-label="verif.ai 홈"><span class="brand-icon"><svg><use href="#i-scan"/></svg></span>verif<span class="brand-dot">.ai</span></a>
    <span class="demo-badge">데모</span>
  </header>
  <main>
    <div class="page-heading">
      <h1>AI 이미지 판별</h1>
      <p>이미지를 업로드하고 결과를 확인하세요.</p>
    </div>
    <div class="analysis-grid">
      <section class="panel" aria-labelledby="upload-title">
        <div class="panel-heading"><h2 id="upload-title">이미지 업로드</h2></div>
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" hidden>
        <div class="drop-zone" id="drop-zone">
          <div id="upload-prompt" class="upload-prompt">
            <svg class="upload-icon" aria-hidden="true"><use href="#i-upload"/></svg>
            <p>이미지를 여기에 드래그하세요</p>
            <button type="button" class="select-button" id="select-file"><svg aria-hidden="true"><use href="#i-image"/></svg> 파일 선택</button>
            <small>JPG, PNG, WEBP · 최대 10MB · 1장</small>
          </div>
          <div class="preview" id="preview" hidden>
            <img id="preview-image" alt="선택한 이미지 미리보기">
            <button class="remove-button" id="remove-file" type="button" aria-label="이미지 삭제"><svg><use href="#i-close"/></svg></button>
            <div class="file-details"><strong id="file-name"></strong><span id="file-meta"></span></div>
          </div>
        </div>
        <p class="error-message" id="error-message" role="alert" hidden></p>
        <button class="analyze-button" id="analyze-button" type="button" disabled><svg aria-hidden="true"><use href="#i-scan"/></svg><span>데모 분석 시작</span></button>
        <p class="privacy-note"><svg aria-hidden="true"><use href="#i-shield"/></svg> 이미지는 서버로 전송되지 않습니다.</p>
      </section>
      <section class="result-panel panel" aria-labelledby="result-title">
        <div class="panel-heading"><h2 id="result-title">판별 결과</h2><span class="result-state" id="result-state">대기 중</span></div>
        <div id="result-content" class="result-content" aria-live="polite" aria-atomic="true">
          <div class="empty-result"><svg aria-hidden="true"><use href="#i-scan"/></svg><p>이미지를 선택한 뒤 분석을 시작하세요.</p></div>
        </div>
      </section>
    </div>
    <p class="demo-notice"><svg aria-hidden="true"><use href="#i-info"/></svg><span>현재는 데모입니다. 분석 수치는 예시이며 실제 AI 판별 결과가 아닙니다.</span></p>
  </main>
</body>
</html>
